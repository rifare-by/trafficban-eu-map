<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Запреты движения грузовиков — ЕС</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;color:#172033;background:#f4f7fb}
header{padding:16px;background:#123d70;color:white}h1{font-size:21px;margin:0 0 6px}header p{margin:0;font-size:14px}
main{max-width:1100px;margin:auto;padding:14px}.legend{display:flex;gap:12px;flex-wrap:wrap;margin:10px 2px;font-size:13px;color:#34445a}.legend span{display:inline-flex;align-items:center;gap:6px}.dot{width:12px;height:12px;border-radius:3px;display:inline-block}
#map{width:100%;height:65vh;min-height:430px;background:#eaf0f5;border:1px solid #ccd5e1;border-radius:14px;display:block}
.country{stroke:#174f70;stroke-width:.65;stroke-linejoin:round;fill-opacity:.42;cursor:pointer;vector-effect:non-scaling-stroke}.country:hover{stroke:#071e35;stroke-width:2;fill-opacity:.72}
.country-label{font-size:11px;font-weight:bold;fill:#102a43;text-anchor:middle;paint-order:stroke;stroke:white;stroke-width:2.5px;stroke-linejoin:round;pointer-events:none}
.downloads{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0}.download{display:inline-block;padding:12px 16px;border-radius:9px;background:#174f91;color:white;text-decoration:none;font-weight:700}
.note{font-size:13px;color:#526174;line-height:1.5;margin:12px 2px 18px}.info{background:white;padding:14px;border-radius:12px;margin:12px 0;min-height:48px;line-height:1.5;box-shadow:0 2px 10px #0000000c}.widget{background:white;padding:14px;border-radius:14px;margin-top:16px;box-shadow:0 2px 10px #00000012}.widget h2{font-size:18px;margin:0 0 10px}iframe{width:100%;height:620px;border:1px solid #bbb}
@media(max-width:600px){#map{height:58vh;min-height:390px}.country-label{font-size:9px}iframe{height:620px}}
</style>
</head>
<body>
<header><h1>Запреты движения грузовиков — Европейский союз</h1><p>Карта стран ЕС и официальный виджет TrafficBan</p></header>
<main>
<div class="legend"><span><i class="dot" style="background:#dc5555"></i> Есть запреты в ближайшие 7 дней</span><span><i class="dot" style="background:#3185d5"></i> Данные есть, запретов нет</span><span><i class="dot" style="background:#aab4c0"></i> Нет данных</span></div>
<svg id="map" viewBox="0 0 1000 650" role="img" aria-label="Интерактивная карта стран Европейского союза"><text x="500" y="325" text-anchor="middle" fill="#526174">Загружаются границы стран…</text></svg>
<div class="downloads"><a class="download" href="https://github.com/rifare-by/trafficban-eu-map/raw/refs/heads/main/downloads/trafficban-eu-map.kml">Скачать KML</a><a class="download" href="https://github.com/rifare-by/trafficban-eu-map/raw/refs/heads/main/downloads/trafficban-eu-map.kmz">Скачать KMZ</a></div>
<div class="info" id="countryInfo">Выберите страну на карте.</div>
<p class="note" id="dataStatus">Загрузка данных…</p>
<section class="widget"><h2>Запреты TrafficBan</h2><iframe src="https://trafficban.com/plugins/box.html?href=trafficban.com&language=ru" title="TrafficBan — запреты движения" loading="lazy"></iframe></section>
</main>
<script>
(async function(){
const svg=document.getElementById("map"), info=document.getElementById("countryInfo"), status=document.getElementById("dataStatus");
const NS="http://www.w3.org/2000/svg";
const names={AUT:"Австрия",BEL:"Бельгия",BGR:"Болгария",HRV:"Хорватия",CYP:"Кипр",CZE:"Чехия",DNK:"Дания",EST:"Эстония",FIN:"Финляндия",FRA:"Франция",DEU:"Германия",GRC:"Греция",HUN:"Венгрия",IRL:"Ирландия",ITA:"Италия",LVA:"Латвия",LTU:"Литва",LUX:"Люксембург",MLT:"Мальта",NLD:"Нидерланды",POL:"Польша",PRT:"Португалия",ROU:"Румыния",SVK:"Словакия",SVN:"Словения",ESP:"Испания",SWE:"Швеция"};
const iso2={AUT:"AT",BEL:"BE",BGR:"BG",HRV:"HR",CYP:"CY",CZE:"CZ",DNK:"DK",EST:"EE",FIN:"FI",FRA:"FR",DEU:"DE",GRC:"GR",HUN:"HU",IRL:"IE",ITA:"IT",LVA:"LV",LTU:"LT",LUX:"LU",MLT:"MT",NLD:"NL",POL:"PL",PRT:"PT",ROU:"RO",SVK:"SK",SVN:"SI",ESP:"ES",SWE:"SE"};
const covered=new Set(["AT","BE","BG","HR","CZ","DE","GR","ES","FR","HU","IT","LU","PL","PT","RO","SE","SI","SK"]);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function allPoints(x,out=[]){if(Array.isArray(x)&&typeof x[0]==="number")out.push(x);else if(Array.isArray(x))x.forEach(v=>allPoints(v,out));return out;}
const merc=p=>{const lat=Math.max(-85.0511,Math.min(85.0511,p[1]))*Math.PI/180;return [(p[0]+180)/360, (1-Math.log(Math.tan(lat)+1/Math.cos(lat))/Math.PI)/2];};
function pathRing(ring,proj){return ring.map((p,i)=>{const q=proj(p);return (i?"L":"M")+q[0].toFixed(2)+","+q[1].toFixed(2)}).join("")+"Z";}
function geometryPath(g,proj){const polys=g.type==="Polygon"?[g.coordinates]:g.coordinates;return polys.map(poly=>poly.map(r=>pathRing(r,proj)).join(" ")).join(" ");}
function showCountry(code,bans){
 const country=names[code]||code,c=iso2[code];
 if(!bans){info.innerHTML="<b>"+esc(country)+"</b><br>Календарь запретов временно недоступен.";return;}
 if(!covered.has(c)){info.innerHTML="<b>"+esc(country)+"</b><br>Нет данных Nakordoni по этой стране. Это не означает, что запретов нет.";return;}
 const rows=(bans.bans||[]).filter(b=>b.country_code===c).sort((a,b)=>(a.date||"").localeCompare(b.date||"")||(a.time_from||"").localeCompare(b.time_from||""));
 let html="<b>"+esc(country)+"</b><br><small>Источник календаря: Nakordoni · "+esc(bans.window?.from)+" — "+esc(bans.window?.to)+"</small><hr>";
 if(!rows.length)html+="На выбранный период в календаре запреты не указаны.";
 else {html+="<b>Запретов: "+rows.length+"</b>";for(const b of rows){html+="<p><b>"+esc(b.date)+"</b><br>"+esc(b.time_from||"Весь день")+(b.time_until?"–"+esc(b.time_until):"")+"<br><b>"+esc(b.restriction_type||"Ограничение")+"</b>"+(b.restriction_details?"<br>"+esc(b.restriction_details):"")+(b.min_weight_tons?"<br>От "+esc(b.min_weight_tons)+" т":"")+( /^https:\/\//i.test(b.details_url||"")?"<br><a target='_blank' rel='noopener' href='"+esc(b.details_url)+"'>Подробнее на Nakordoni</a>":"")+"</p>";}}
 info.innerHTML=html;
}
try{
 const [geoResp,banResp]=await Promise.all([fetch("./data/eu-countries.geojson"),fetch("./data/truck-bans.json")]);
 if(!geoResp.ok)throw new Error("GeoJSON: HTTP "+geoResp.status);
 const geo=await geoResp.json();let bans=null;
 if(banResp.ok)bans=await banResp.json();
 const features=geo.features.filter(f=>names[f.properties["ISO3166-1-Alpha-3"]]);
 if(features.length!==27)throw new Error("Загружено стран: "+features.length+" из 27");
 const pts=features.flatMap(f=>allPoints(f.geometry.coordinates));
 const world=pts.map(merc),minX=Math.min(...world.map(p=>p[0])),maxX=Math.max(...world.map(p=>p[0])),minY=Math.min(...world.map(p=>p[1])),maxY=Math.max(...world.map(p=>p[1]));
 const pad=24,scale=Math.min((1000-2*pad)/(maxX-minX),(650-2*pad)/(maxY-minY));
 const w=(maxX-minX)*scale,h=(maxY-minY)*scale,ox=(1000-w)/2,oy=(650-h)/2;
 const project=p=>{const q=merc(p);return [ox+(q[0]-minX)*scale,oy+(q[1]-minY)*scale];};
 svg.replaceChildren();
 // OpenStreetMap raster tiles as a geographic background, aligned to the country polygons.
 const z=5,n=Math.pow(2,z),tileSize=256;
 const left=Math.floor(minX*n),right=Math.floor(maxX*n),top=Math.floor(minY*n),bottom=Math.floor(maxY*n);
 for(let tx=left;tx<=right;tx++)for(let ty=top;ty<=bottom;ty++){
  const img=document.createElementNS(NS,"image");
  img.setAttribute("x",ox+(tx/n-minX)*scale);img.setAttribute("y",oy+(ty/n-minY)*scale);
  img.setAttribute("width",tileSize*n*scale/256);img.setAttribute("height",tileSize*n*scale/256);
  img.setAttribute("href","https://tile.openstreetmap.org/"+z+"/"+tx+"/"+ty+".png");
  img.setAttribute("preserveAspectRatio","none");svg.appendChild(img);
 }

 const active=new Set((bans?.bans||[]).map(b=>b.country_code));
 for(const f of features){
  const code=f.properties["ISO3166-1-Alpha-3"],c=iso2[code],has=covered.has(c),hasBan=active.has(c);
  const fill=!has?"#aab4c0":hasBan?"#dc5555":"#3185d5";
  const path=document.createElementNS(NS,"path");path.setAttribute("d",geometryPath(f.geometry,project));path.setAttribute("class","country");path.setAttribute("fill",fill);path.setAttribute("fill-rule","evenodd");path.addEventListener("click",()=>showCountry(code,bans));
  const title=document.createElementNS(NS,"title");title.textContent=names[code];path.appendChild(title);svg.appendChild(path);
  const countryPts=allPoints(f.geometry.coordinates),cx=(Math.min(...countryPts.map(p=>p[0]))+Math.max(...countryPts.map(p=>p[0])))/2,cy=(Math.min(...countryPts.map(p=>p[1]))+Math.max(...countryPts.map(p=>p[1])))/2;
  const pos=project([cx,cy]),label=document.createElementNS(NS,"text");label.setAttribute("x",pos[0]);label.setAttribute("y",pos[1]);label.setAttribute("class","country-label");label.textContent=names[code];label.addEventListener("click",()=>showCountry(code,bans));svg.appendChild(label);
 }
 const attribution=document.createElementNS(NS,"text");attribution.setAttribute("x","990");attribution.setAttribute("y","640");attribution.setAttribute("text-anchor","end");attribution.setAttribute("font-size","10");attribution.setAttribute("fill","#263746");attribution.textContent="© OpenStreetMap contributors";svg.appendChild(attribution);
 status.textContent=bans?"Карта загружена: 27 стран ЕС. Календарь обновлён "+new Date(bans.generated_at).toLocaleString("ru-RU")+". Данные Nakordoni доступны по 18 из 27 стран.":"Границы загружены. Календарь запретов временно недоступен.";
}catch(e){status.textContent="Ошибка загрузки карты: "+e.message;svg.replaceChildren();const t=document.createElementNS(NS,"text");t.setAttribute("x","500");t.setAttribute("y","325");t.setAttribute("text-anchor","middle");t.setAttribute("fill","#a22");t.textContent="Не удалось загрузить данные карты";svg.appendChild(t);console.error(e);}
})();
</script>
</body></html>
