<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="">
<title>Запреты движения грузовиков — ЕС</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;color:#172033;background:#f4f7fb}
header{padding:16px;background:#123d70;color:white}h1{font-size:21px;margin:0 0 6px}header p{margin:0;font-size:14px}
main{max-width:1100px;margin:auto;padding:14px}.legend{display:flex;gap:12px;flex-wrap:wrap;margin:10px 2px;font-size:13px;color:#34445a}.legend span{display:inline-flex;align-items:center;gap:6px}.dot{width:12px;height:12px;border-radius:3px;display:inline-block}
#map{width:100%;height:65vh;min-height:430px;background:#dce8ef;border:1px solid #ccd5e1;border-radius:14px;overflow:hidden;z-index:1}.map-tools{display:flex;justify-content:flex-end;gap:8px;margin:8px 0}.map-tools button{border:1px solid #b8c7d6;background:white;border-radius:8px;padding:9px 15px;font-size:18px;font-weight:bold;color:#173d60;cursor:pointer}.map-tools button.reset{font-size:14px}
.leaflet-container{font:inherit}.leaflet-interactive:focus{outline:none}.leaflet-control-attribution{font-size:10px!important}.country-label{background:transparent;border:0;cursor:pointer}.country-label .country-bubble{cursor:pointer;transition:box-shadow .12s}.country-label:hover .country-bubble{box-shadow:0 2px 9px #17203355}.country-label:focus{outline:none}.country-popup{font:13px/1.4 Arial,sans-serif;max-width:250px}.country-popup p{overflow-wrap:anywhere}.country-label:focus .country-bubble{outline:2px solid #ff9800;outline-offset:2px}.country-bubble{display:flex;align-items:center;gap:4px;width:142px;min-width:0;max-width:142px;box-sizing:border-box;padding:3px 5px 3px 3px;border:1px solid #d7e0e9;border-radius:18px;background:rgba(255,255,255,.94);box-shadow:0 1px 4px #17203330;color:#172033;white-space:nowrap;overflow:hidden}.country-flag{width:21px;height:21px;flex:0 0 21px;display:flex;align-items:center;justify-content:center;border:1px solid #e1e6ed;border-radius:50%;background:#fff;font-size:15px;line-height:1;box-shadow:0 1px 2px #0002}.country-label-text{min-width:0;flex:1;text-align:left;line-height:1.05;overflow:hidden}.country-name{display:block;overflow:hidden;text-overflow:ellipsis;font-size:9px;font-weight:800;letter-spacing:0}.country-bubble .ban{display:block;margin-top:2px;font-size:7.5px;line-height:1.25;font-weight:800;overflow:hidden;text-overflow:ellipsis}.country-bubble .yes{color:#c62828}.country-bubble .no{color:#16723a}.country-bubble .unknown{color:#66717e}.country-bubble.flag-only{width:25px;max-width:25px;padding:1px;border-radius:50%;justify-content:center;background:rgba(255,255,255,.96)}.country-bubble.flag-only .country-label-text{display:none}.country-bubble.flag-only .country-flag{width:21px;height:21px;flex-basis:21px}
.downloads{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0}.download{display:inline-block;padding:12px 16px;border-radius:9px;background:#174f91;color:white;text-decoration:none;font-weight:700}
.note{font-size:13px;color:#526174;line-height:1.5;margin:12px 2px 18px}.info{background:white;padding:14px;border-radius:12px;margin:12px 0;min-height:48px;line-height:1.5;box-shadow:0 2px 10px #0000000c}.widget{background:white;padding:14px;border-radius:14px;margin-top:16px;box-shadow:0 2px 10px #00000012}.widget h2{font-size:18px;margin:0 0 10px}iframe{width:100%;height:620px;border:1px solid #bbb}
@media(max-width:600px){#map{height:58vh;min-height:390px}.country-label{font-size:10px}iframe{height:620px}}
</style>
</head>
<body>
<header><h1>Запреты движения грузовиков — Европейский союз</h1><p>Карта стран ЕС и официальный виджет TrafficBan</p></header>
<main>
<div class="legend"><span><i class="dot" style="background:#dc5555"></i> Запрет сегодня</span><span><i class="dot" style="background:#3185d5"></i> Сегодня запретов нет</span><span><i class="dot" style="background:#aab4c0"></i> Нет данных</span></div>
<div class="map-tools"><button type="button" id="zoomIn" aria-label="Приблизить">+</button><button type="button" id="zoomOut" aria-label="Отдалить">−</button><button type="button" class="reset" id="zoomReset">Сброс</button></div><div id="map" role="application" aria-label="Интерактивная карта стран Европейского союза"><p style="padding:24px;color:#526174">Загружается интерактивная карта…</p></div>
<div class="downloads"><a class="download" href="https://github.com/rifare-by/trafficban-eu-map/raw/refs/heads/main/downloads/trafficban-eu-map.kml">Скачать KML</a><a class="download" href="https://github.com/rifare-by/trafficban-eu-map/raw/refs/heads/main/downloads/trafficban-eu-map.kmz">Скачать KMZ</a></div>
<div class="info" id="countryInfo">Выберите страну на карте.</div>
<p class="note" id="dataStatus">Загрузка данных…</p>
<section class="widget"><h2>Запреты TrafficBan</h2><iframe src="https://trafficban.com/plugins/box.html?href=trafficban.com&language=ru" title="TrafficBan — запреты движения" loading="lazy"></iframe></section>
</main>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
<script src="https://unpkg.com/@turf/turf@7/turf.min.js"></script>
<script>
(async function(){
const info=document.getElementById("countryInfo"),status=document.getElementById("dataStatus");
const names={AUT:"Австрия",BEL:"Бельгия",BGR:"Болгария",HRV:"Хорватия",CYP:"Кипр",CZE:"Чехия",DNK:"Дания",EST:"Эстония",FIN:"Финляндия",FRA:"Франция",DEU:"Германия",GRC:"Греция",HUN:"Венгрия",IRL:"Ирландия",ITA:"Италия",LVA:"Латвия",LTU:"Литва",LUX:"Люксембург",MLT:"Мальта",NLD:"Нидерланды",POL:"Польша",PRT:"Португалия",ROU:"Румыния",SVK:"Словакия",SVN:"Словения",ESP:"Испания",SWE:"Швеция"};
const iso2={AUT:"AT",BEL:"BE",BGR:"BG",HRV:"HR",CYP:"CY",CZE:"CZ",DNK:"DK",EST:"EE",FIN:"FI",FRA:"FR",DEU:"DE",GRC:"GR",HUN:"HU",IRL:"IE",ITA:"IT",LVA:"LV",LTU:"LT",LUX:"LU",MLT:"MT",NLD:"NL",POL:"PL",PRT:"PT",ROU:"RO",SVK:"SK",SVN:"SI",ESP:"ES",SWE:"SE"};
const covered=new Set(["AT","BE","BG","HR","CZ","DE","GR","ES","FR","HU","IT","LU","PL","PT","RO","SE","SI","SK"]);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function isMainTruckBan(b){
 const type=String(b?.restriction_type||"").trim().toLowerCase();
 const details=String(b?.restriction_details||"").toLowerCase();
 if(type==="local")return false;
 if(/dangerous goods|hazardous goods|hazmat|dangerous cargo|adr|gefahrgut|mati[eè]res dangereuses|mercanc[ií]as peligrosas|merci pericolose|gevaarlijke stoffen|опасн\w* груз|опасн\w* веществ/i.test(details))return false;
 if(/\broads?\b|\broad network\b|\bautoroutes?\b|\bmotorways?\b|\bhighways?\b|\bfreeways?\b|\bcarriageways?\b|дорог\w*|автотрасс\w*/i.test(details))return false;
 if(/\b(?:A|AP|N|D|E|M|R|B|L|SR|Z)\s?-?\d{1,4}\b/i.test(details))return false;
 return true;
}
function mainTruckBans(list){return (list||[]).filter(isMainTruckBan);}
function ruType(v){return ({Sunday:"Воскресный запрет",Holiday:"Праздничный запрет","Regional Holiday":"Региональный запрет",General:"Общее ограничение",Seasonal:"Сезонное ограничение",Local:"Местное ограничение"})[v]||({Restriction:"Ограничение"})[v]||v||"Ограничение";}
function ruDetails(v){
 let x=String(v||"");
 const pairs=[
 ["Sunday & public-holiday ban","воскресный и праздничный запрет"],["year-round","круглогодично"],["nationwide","по всей стране"],["all roads","на всех дорогах"],
 ["vehicles without Lärmarmzertifikat","транспорт без сертификата низкого уровня шума"],["All Saints' Day","День всех святых"],["All Saints’ Day","День всех святых"],
 ["Public holiday:","Государственный праздник:"],["dangerous-goods transports","перевозка опасных грузов"],["selected road sections","отдельные участки дорог"],
 ["entire territory","вся территория страны"],["working days","в рабочие дни"],["heavy goods vehicles","тяжёлые грузовые автомобили"],
 ["trucks over","грузовики свыше"],["trucks >","грузовики свыше"],["and others","и другие"],["trucks","грузовики"],["roads","дороги"],
 ["Mon-Sat","пн–сб"],["vehicles","транспортные средства"],["since the September 2026 reform","согласно изменениям сентября 2026 года"],
 ["from 06:00 since the September 2026 reform","с 06:00 согласно изменениям сентября 2026 года"]
 ];
 for(const [from,to] of pairs)x=x.replace(new RegExp(from.replace(/[.*+?^${}()|[\]\\]/g,"\\$&"),"gi"),to);
 x=x.replace(/([0-9.]+)\s*t\b/gi,"$1 т").replace(/Nat\.route/gi,"трасса").replace(/Autoroutes/gi,"автомагистрали").replace(/Province/gi,"провинция").replace(/Bucharest/gi,"Бухарест").replace(/Brasov/gi,"Брашов");
 return x;
}
function ruDate(d){return new Date(d+"T12:00:00").toLocaleDateString("ru-RU",{weekday:"long",day:"numeric",month:"long"});}
function allPoints(x,out=[]){if(Array.isArray(x)&&typeof x[0]==="number")out.push(x);else if(Array.isArray(x))x.forEach(v=>allPoints(v,out));return out;}
function flagEmoji(iso){return iso.toUpperCase().replace(/[A-Z]/g,ch=>String.fromCodePoint(127397+ch.charCodeAt(0)));}
const EUROPE={west:-12,east:35,south:34,north:72};
function europeanGeometry(g){const polys=g.type==="Polygon"?[g.coordinates]:g.coordinates;const kept=polys.filter(poly=>{const pts=allPoints(poly);if(!pts.length)return false;const xs=pts.map(p=>p[0]),ys=pts.map(p=>p[1]);return Math.max(...xs)>=EUROPE.west&&Math.min(...xs)<=EUROPE.east&&Math.max(...ys)>=EUROPE.south&&Math.min(...ys)<=EUROPE.north;});if(!kept.length)return null;return g.type==="Polygon"&&kept.length===1?{type:"Polygon",coordinates:kept[0]}:{type:"MultiPolygon",coordinates:kept};}
function showCountry(code,bans){
 const country=names[code]||code,c=iso2[code];
 if(!bans){info.innerHTML="<b>"+esc(country)+"</b><br>Календарь запретов временно недоступен.";return;}
 if(!covered.has(c)){info.innerHTML="<b>"+esc(country)+"</b><br>Нет данных по этой стране. Это не означает, что запретов нет.";return;}
 const today=bans.window?.from||new Date().toLocaleDateString("en-CA");
 const tomorrow=new Date(today+"T12:00:00");tomorrow.setDate(tomorrow.getDate()+1);
 const tomorrowKey=tomorrow.getFullYear()+"-"+String(tomorrow.getMonth()+1).padStart(2,"0")+"-"+String(tomorrow.getDate()).padStart(2,"0");
 const rowsFor=date=>mainTruckBans(bans.bans).filter(b=>b.country_code===c&&b.date===date).sort((a,b)=>(a.time_from||"").localeCompare(b.time_from||""));
 function section(title,date,known){
  const rows=rowsFor(date);let out="<section style='margin:9px 0'><b>"+title+" — "+esc(ruDate(date))+"</b><br>";
  if(!known)return out+"<span style='color:#66717e'>Нет данных на эту дату</span></section>";
  if(!rows.length)return out+"<span style='color:#16723a'><b>Запретов в календаре не указано</b></span></section>";
  out+="<b style='color:#c62828'>Ограничений: "+rows.length+"</b>";
  rows.forEach(b=>{out+="<p style='margin:5px 0 0'><b>"+esc(b.time_from||"Весь день")+(b.time_until?"–"+esc(b.time_until):"")+"</b> · "+esc(ruType(b.restriction_type))+(b.min_weight_tons?"<br>Для транспорта от "+esc(b.min_weight_tons)+" т":"")+(b.restriction_details?"<br>"+esc(ruDetails(b.restriction_details)):"")+( /^https:\/\//i.test(b.details_url||"")?"<br><a target='_blank' rel='noopener' href='"+esc(b.details_url)+"'>Подробнее</a>":"")+"</p>";});
  return out+"</section>";
 }
 const tomorrowKnown=tomorrowKey<=String(bans.window?.to||"");
 info.innerHTML="<b>"+esc(country)+"</b><br><small>Источник календаря: Nakordoni · данные обновлены "+esc(new Date(bans.generated_at).toLocaleString("ru-RU"))+"</small><hr>"+
 section("СЕГОДНЯ",today,true)+section("ЗАВТРА",tomorrowKey,tomorrowKnown)+
 "<small style='color:#66717e'>«Нет данных» не означает отсутствие запрета.</small>";
}
try{
 if(!window.L)throw new Error("Не загрузилась библиотека интерактивной карты. Проверьте доступ к unpkg.com.");
 const map=L.map("map",{zoomControl:true,scrollWheelZoom:true,touchZoom:true,dragging:true,doubleClickZoom:true,minZoom:3,maxZoom:13}).setView([51.2,13.5],4);
 L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:19,attribution:'&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'}).addTo(map);
 document.getElementById("zoomIn").addEventListener("click",()=>map.zoomIn());
 document.getElementById("zoomOut").addEventListener("click",()=>map.zoomOut());
 function refreshCountryLabels(){const compact=map.getZoom()<5;countryLabelMarkers.forEach(marker=>{const el=marker.getElement();const bubble=el&&el.querySelector(".country-bubble");if(bubble)bubble.classList.toggle("flag-only",compact);});}
 map.on("zoomend",()=>{countryLabelMarkers.forEach(marker=>{if(marker._countryAnchor){marker.setLatLng(marker._countryAnchor);marker.update();}});refreshCountryLabels();});
 let euBounds=null;
 document.getElementById("zoomReset").addEventListener("click",()=>{if(euBounds)map.fitBounds(euBounds,{padding:[18,18]});});
 const [geoResp,banResp]=await Promise.all([fetch("./data/eu-countries.geojson"),fetch("./data/truck-bans.json")]);
 if(!geoResp.ok)throw new Error("GeoJSON: HTTP "+geoResp.status);
 const geo=await geoResp.json();let bans=null;if(banResp.ok)bans=await banResp.json();
 const features=geo.features.filter(f=>names[f.properties["ISO3166-1-Alpha-3"]]);
 const countryLabelMarkers=[];
 if(features.length!==27)throw new Error("В исходных границах найдено "+features.length+" стран ЕС вместо 27");
 const display=features.map(f=>({feature:f,geometry:europeanGeometry(f.geometry)})).filter(x=>x.geometry);
 const missing=features.filter(f=>!display.some(x=>x.feature===f)).map(f=>names[f.properties["ISO3166-1-Alpha-3"]]);
 if(missing.length)throw new Error("Не найдены на европейской карте: "+missing.join(", "));
 let selectedCountryLayer=null;const today=bans?.window?.from||new Date().toLocaleDateString("en-CA"),todayRows=mainTruckBans(bans?.bans).filter(b=>b.date===today),active=new Set(todayRows.map(b=>b.country_code)),layers=[];
 for(const item of display){
  const f=item.feature,geometry=item.geometry,code=f.properties["ISO3166-1-Alpha-3"],c=iso2[code],has=covered.has(c),dayBans=todayRows.filter(b=>b.country_code===c),hasBan=dayBans.length>0,fill=!has?"#aab4c0":hasBan?"#dc5555":"#3185d5";
  const baseStyle={color:"#174f70",weight:1,fillColor:fill,fillOpacity:.42};
  const layer=L.geoJSON(geometry,{style:baseStyle,onEachFeature:(feature,lyr)=>{lyr.bindTooltip(names[code],{sticky:true});}});
  layer._baseCountryStyle=baseStyle;layer.addTo(map);layers.push(layer);
  // Центр масс геометрии страны, а не центр прямоугольника её границ.
  const center=(()=>{if(window.turf){const xy=turf.centerOfMass(geometry).geometry.coordinates;return L.latLng(xy[1],xy[0]);}return layer.getBounds().getCenter();})();
  const tomorrow=new Date(today+"T12:00:00");tomorrow.setDate(tomorrow.getDate()+1);const tomorrowKey=tomorrow.getFullYear()+"-"+String(tomorrow.getMonth()+1).padStart(2,"0")+"-"+String(tomorrow.getDate()).padStart(2,"0");const tomorrowRows=mainTruckBans(bans?.bans).filter(b=>b.date===tomorrowKey&&b.country_code===c);
  const todayKnown=!!bans&&has,tomorrowKnown=!!bans&&has&&tomorrowKey<=String(bans.window?.to||"");
  const todayState={label:!todayKnown?"НЕТ ДАННЫХ":dayBans.length?"ЕСТЬ ЗАПРЕТ":"НЕТ ЗАПРЕТА",cls:!todayKnown?"unknown":dayBans.length?"yes":"no"};
  const tomorrowState={label:!tomorrowKnown?"НЕТ ДАННЫХ":tomorrowRows.length?"ЕСТЬ ЗАПРЕТ":"НЕТ ЗАПРЕТА",cls:!tomorrowKnown?"unknown":tomorrowRows.length?"yes":"no"};
  const labelHtml='<div class="country-bubble"><span class="country-flag">'+flagEmoji(iso2[code])+'</span><span class="country-label-text"><span class="country-name">'+esc(names[code])+'</span><span class="ban '+todayState.cls+'">СЕГОДНЯ: '+esc(todayState.label)+'</span><span class="ban '+tomorrowState.cls+'">ЗАВТРА: '+esc(tomorrowState.label)+'</span></span></div>';
  const labelMarker=L.marker(center,{interactive:true,riseOnHover:true,keyboard:true,title:"Показать "+names[code],icon:L.divIcon({className:"country-label",html:labelHtml,iconSize:[142,48],iconAnchor:[71,24]})}).addTo(map);labelMarker._countryAnchor=center;
  const dateLabel=ruDate(today),tomorrowLabel=ruDate(tomorrowKey);
  function renderDay(title,date,rows,known){let out='<section style="margin:7px 0"><b>'+title+' — '+esc(date)+'</b><br>';if(!known)return out+'<span style="color:#66717e">Нет данных на эту дату</span></section>';if(!rows.length)return out+'<span style="color:#16723a"><b>Запретов в календаре не указано</b></span></section>';out+='<b style="color:#c62828">Ограничений: '+rows.length+'</b>';rows.slice(0,5).forEach(b=>{out+='<p style="margin:5px 0 0"><b>'+esc(b.time_from||"Весь день")+(b.time_until?"–"+esc(b.time_until):"")+'</b> · '+esc(ruType(b.restriction_type))+(b.min_weight_tons?'<br>Для транспорта от '+esc(b.min_weight_tons)+' т':'')+(b.restriction_details?'<br>'+esc(ruDetails(b.restriction_details)):"")+'</p>';});if(rows.length>5)out+='<small>И ещё '+(rows.length-5)+' ограничений</small>';const url=rows.find(b=>/^https:\/\//i.test(b.details_url||""))?.details_url;if(url)out+='<p style="margin:6px 0 0"><a target="_blank" rel="noopener" href="'+esc(url)+'">Подробнее</a></p>';return out+'</section>';}
  let popupHtml='<div class="country-popup"><b>'+esc(names[code])+'</b><br><small>Информация по календарю запретов</small><hr style="margin:6px 0">';
  popupHtml+=renderDay("СЕГОДНЯ",dateLabel,dayBans,todayKnown);
  popupHtml+=renderDay("ЗАВТРА",tomorrowLabel,tomorrowRows,tomorrowKnown);
  popupHtml+='<small style="color:#66717e">«Нет данных» не означает отсутствие запрета.</small></div>';
  labelMarker.bindPopup(popupHtml,{maxWidth:270,autoPan:true,closeButton:true});
  labelMarker.on("click",()=>{if(selectedCountryLayer){selectedCountryLayer.setStyle(selectedCountryLayer._baseCountryStyle);selectedCountryLayer=null;}layer.setStyle({color:"#ff9800",weight:3,fillOpacity:.55});layer.bringToFront();selectedCountryLayer=layer;showCountry(code,bans);});
  labelMarker.on("click",()=>labelMarker.openPopup());
  countryLabelMarkers.push(labelMarker);
 }
 euBounds=L.latLngBounds(layers.map(x=>x.getBounds()));map.fitBounds(euBounds,{padding:[18,18]});refreshCountryLabels();
 status.textContent=bans?"Карта загружена: все 27 стран ЕС. Статус запретов на '+today+'. Календарь обновлён "+new Date(bans.generated_at).toLocaleString("ru-RU")+". Данные Nakordoni доступны по 18 из 27 стран ЕС. Показаны только общие воскресные и праздничные запреты; специальные и локальные ограничения исключены.":"Границы загружены. Календарь запретов временно недоступен.";
 setTimeout(()=>map.invalidateSize(),150);
}catch(e){status.textContent="Ошибка загрузки карты: "+e.message;document.getElementById("map").innerHTML="<p style='padding:24px;color:#a22'>Не удалось загрузить интерактивную карту: "+esc(e.message)+"</p>";console.error(e);}
})();
</script>
</body></html>
