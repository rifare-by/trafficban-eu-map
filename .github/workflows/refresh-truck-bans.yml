name: Refresh NAPSPAN road events

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/refresh-truck-bans.yml"
      - "scripts/fetch-road-events.mjs"
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Fetch NAPSPAN road restrictions (optional)
        run: node scripts/fetch-road-events.mjs
        env:
          NAPSPAN_API_KEY: ${{ secrets.NAPSPAN_API_KEY }}
      - name: Commit refreshed data and map files
        run: |
          git add -f data/road-events.json
          if git diff --cached --quiet; then
            echo "No data changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Refresh NAPSPAN road events"
          for attempt in 1 2 3; do
            git fetch origin main
            if git rebase origin/main && git push origin HEAD:main; then
              exit 0
            fi
            git rebase --abort || true
            sleep $((attempt * 3))
          done
          echo "Could not push refreshed data after 3 attempts" >&2
          exit 1
