name: Refresh truck bans data

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/refresh-truck-bans.yml"
      - "scripts/fetch-truck-bans.mjs"
      - "scripts/build-kml.mjs"
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Fetch Nakordoni truck bans
        run: node scripts/fetch-truck-bans.mjs
        env:
          NKD_API_KEY: ${{ secrets.NAKORDONI_API_KEY_V2 }}
      - name: Build KML and KMZ
        run: |
          npm install --no-save jszip
          node scripts/build-kml.mjs
      - name: Commit refreshed data and map files
        run: |
          git add -f data/truck-bans.json data/eu-countries.geojson downloads/trafficban-eu-map.kml downloads/trafficban-eu-map.kmz
          if git diff --cached --quiet; then
            echo "No data changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Refresh truck bans and export KML KMZ"
          git push
